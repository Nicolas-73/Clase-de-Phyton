<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Índice de masa corporal</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <main>
        <section class="header">
            <h3 class="header__title">Índice de masa corporal</h3>
        </section>

        <section class="calculator">
            <label class="calculator__label" for="">Peso (KG)</label>
            <input type="text" placeholder="Ej. 50" class="calculator__input">
            <label class="calculator__label" for="">Altura (CM)</label>
            <input type="text" placeholder="Ej. 170" class="calculator__input">
            <button class="calculator__btn">Calcular</button>
            <p class="calculator__result"></p>
        </section>
    </main>

    <script src="main.js"></script>
</body>
</html>
