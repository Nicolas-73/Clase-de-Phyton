<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Índice de masa corporal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Outfit:wght@100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Public+Sans:ital,wght@0,100..900;1,100..900&family=Raleway:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <main>
        <section class="header">
            <h3 class="header__title">Índice de masa corporal</h3>
        </section>

        <section class="calculator">
            <label class="calculator__label" for="">Peso (KG)</label>
            <input type="number" placeholder="Ej. 50" class="calculator__input1">
            <label class="calculator__label" for="">Altura (CM)</label>
            <input type="number" placeholder="Ej. 170" class="calculator__input2">
            <button class="calculator__btn" onclick="event">Calcular</button>
            <span class="imc" id="imc">--</span>
        </section>
    </main>

    <script src="main.js"></script>
</body>
</html>
